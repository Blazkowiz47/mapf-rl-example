[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mapf-rl-example"
version = "0.9.1"
description = "Standalone RL trainer, MAPF, and continuous-control examples."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deep-learning-core>=0.1.0,<0.2",
    "deep-learning-robotics>=0.0.6,<0.1",
    "deep-learning-wandb>=0.0.15,<0.1",
    "imageio>=2.34",
    "numpy",
    "opencv-python-headless",
    "torchvision",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
