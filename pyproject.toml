[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mapf-rl-example"
version = "0.4.0"
description = "Vector DQN example for a two-agent MAPF problem."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deep-learning-core>=0.0.31,<0.1",
    "deep-learning-robotics>=0.0.3,<0.1",
    "deep-learning-wandb>=0.0.13,<0.1",
    "imageio>=2.34",
    "numpy",
    "opencv-python-headless",
    "torchvision",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.uv.sources]
deep-learning-core = { path = "../dl-core", editable = true }
deep-learning-robotics = { path = "../dl-robotics", editable = true }
deep-learning-wandb = { path = "../dl-wandb", editable = true }
