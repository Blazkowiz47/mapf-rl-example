seed: 2026
deterministic: true

runtime:
  output_dir: artifacts
  log_level: INFO

experiment:
  name: mapf_ppo_example
  description: "PPO on a vectorized discrete two-agent crossing task"

accelerator:
  type: single_gpu

environment:
  name: robotics_mapf_vector
  num_envs: 4
  interaction_rule:
    name: example_exclusive_cell
  scenario:
    name: two_agent_crossing
    width: 5
    height: 5
    max_steps: 12
    starts: [[0, 0], [4, 4]]
    goals: [[4, 4], [0, 0]]
    walls: [[1, 2], [3, 2]]
  rewards:
    step: -0.01
    progress: 0.10
    collision: -0.25
    goal: 1.0
    success: 5.0
  render:
    cell_size: 32
    show_grid: true

evaluation_environment:
  name: robotics_mapf
  interaction_rule:
    name: example_exclusive_cell
  scenario:
    name: two_agent_crossing
    width: 5
    height: 5
    max_steps: 12
    starts: [[0, 0], [4, 4]]
    goals: [[4, 4], [0, 0]]
    walls: [[1, 2], [3, 2]]
  rewards:
    step: -0.01
    progress: 0.10
    collision: -0.25
    goal: 1.0
    success: 5.0
  render:
    cell_size: 32
    show_grid: true

models:
  policy:
    name: example_ppo_policy
    hidden_sizes: [64, 64]

optimizers:
  name: adam
  lr: 0.0003

trainer:
  ppo:
    total_timesteps: 100000
    max_episode_steps: 12
    evaluation_frequency: 1000
    evaluation_episodes: 5
    checkpoint_frequency: 0
    checkpoint_frequency_steps: 25000
    show_progress: true
    gamma: 0.99
    gae_lambda: 0.95
    rollout_steps: 128
    update_epochs: 4
    minibatch_size: 128
    clip_range: 0.2
    value_clip_range: 0.2
    value_loss_coefficient: 0.5
    entropy_coefficient: 0.01
    normalize_advantages: true

episode_managers:
  robotics:
    capture_phases: [evaluation]
    capture_every_n_episodes: 1
    max_captured_episodes: 2
    info_keys:
      - episode_collisions
      - makespan
      - sum_of_costs
      - path_length
    media_format: gif
    fps: 6
    cell_size: 32

callbacks:
  local_metric_tracker:
    log_frequency: 1
