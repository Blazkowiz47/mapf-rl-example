seed: 2026
deterministic: true

runtime:
  output_dir: artifacts
  log_level: INFO

experiment:
  name: mapf_rl_example
  description: "Centralized DQN on a two-agent crossing task"

accelerator:
  type: single_gpu

environment:
  name: robotics_mapf_vector
  num_envs: 4
  interaction_rule:
    name: example_exclusive_cell
  scenario:
    name: two_agent_crossing
    width: 5
    height: 5
    max_steps: 12
    starts: [[0, 0], [4, 4]]
    goals: [[4, 4], [0, 0]]
    walls: [[1, 2], [3, 2]]
  rewards:
    step: -0.01
    progress: 0.10
    collision: -0.25
    goal: 1.0
    success: 5.0
  render:
    cell_size: 32
    show_grid: true

evaluation_environment:
  name: robotics_mapf
  interaction_rule:
    name: example_exclusive_cell
  scenario:
    name: two_agent_crossing
    width: 5
    height: 5
    max_steps: 12
    starts: [[0, 0], [4, 4]]
    goals: [[4, 4], [0, 0]]
    walls: [[1, 2], [3, 2]]
  rewards:
    step: -0.01
    progress: 0.10
    collision: -0.25
    goal: 1.0
    success: 5.0
  render:
    cell_size: 32
    show_grid: true

models:
  q_network:
    name: example_dqn_mlp
    hidden_sizes: [64, 64]

optimizers:
  name: adam
  lr: 0.001

trainer:
  dqn:
    total_timesteps: 100000
    max_episode_steps: 12
    evaluation_frequency: 1000
    evaluation_episodes: 5
    checkpoint_frequency: 0
    checkpoint_frequency_steps: 25000
    show_progress: true
    gamma: 0.99
    buffer_size: 25000
    batch_size: 64
    learning_starts: 1000
    train_frequency: 4
    gradient_steps: 1
    target_update_frequency: 1000
    double_dqn: true
    epsilon_start: 1.0
    epsilon_end: 0.10
    epsilon_decay_steps: 75000

episode_managers:
  robotics:
    capture_phases: [evaluation]
    capture_every_n_episodes: 1
    max_captured_episodes: 2
    info_keys:
      - episode_collisions
      - makespan
      - sum_of_costs
      - path_length
    media_format: gif
    fps: 6
    cell_size: 32

callbacks:
  local_metric_tracker:
    log_frequency: 1
