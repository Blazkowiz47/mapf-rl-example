seed: 2026
deterministic: true

runtime:
  output_dir: artifacts
  log_level: INFO

experiment:
  name: mapf_dreamer_example
  description: "Dreamer on a vectorized discrete two-agent crossing task"

accelerator:
  type: single_gpu

environment:
  name: robotics_mapf_vector
  num_envs: 4
  observation_builder:
    name: semantic_grid
  interaction_rule:
    name: example_exclusive_cell
  scenario:
    name: two_agent_crossing
    width: 5
    height: 5
    max_steps: 12
    starts: [[0, 0], [4, 4]]
    goals: [[4, 4], [0, 0]]
    walls: [[1, 2], [3, 2]]
  rewards:
    step: -0.01
    progress: 0.1
    collision: -0.25
    goal: 1.0
    success: 5.0
  render:
    cell_size: 32
    show_grid: true

evaluation_environment:
  name: robotics_mapf
  observation_builder:
    name: semantic_grid
  interaction_rule:
    name: example_exclusive_cell
  scenario:
    name: two_agent_crossing
    width: 5
    height: 5
    max_steps: 12
    starts: [[0, 0], [4, 4]]
    goals: [[4, 4], [0, 0]]
    walls: [[1, 2], [3, 2]]
  rewards:
    step: -0.01
    progress: 0.1
    collision: -0.25
    goal: 1.0
    success: 5.0
  render:
    cell_size: 32
    show_grid: true

models:
  world_model:
    name: dreamer_world_model
    embedding_size: 64
    deterministic_size: 64
    stochastic_size: 8
    classes: 8
    hidden_size: 128
  actor:
    name: dreamer_actor
    hidden_size: 128
  critic:
    name: dreamer_critic
    hidden_size: 128

optimizers:
  world_model:
    name: adam
    lr: 0.0001
  actor:
    name: adam
    lr: 0.00003
  critic:
    name: adam
    lr: 0.00003

trainer:
  dreamer:
    total_timesteps: 100000
    max_episode_steps: 12
    evaluation_frequency: 1000
    evaluation_episodes: 5
    checkpoint_frequency: 0
    checkpoint_frequency_steps: 25000
    show_progress: true
    gamma: 0.99
    lambda_: 0.95
    buffer_size: 100000
    batch_size: 16
    sequence_length: 8
    burn_in: 2
    learning_starts: 1000
    train_frequency: 16
    gradient_steps: 1
    imagination_horizon: 8
    checkpoint_replay_buffer: true

episode_managers:
  robotics:
    capture_phases: [evaluation]
    capture_every_n_episodes: 1
    max_captured_episodes: 2
    info_keys:
      - episode_collisions
      - makespan
      - sum_of_costs
      - path_length
    media_format: gif
    fps: 6
    cell_size: 32

callbacks:
  local_metric_tracker:
    log_frequency: 1
