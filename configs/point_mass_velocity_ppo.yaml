seed: 2026
deterministic: true

runtime:
  output_dir: artifacts
  log_level: INFO

experiment:
  name: point_mass_velocity_ppo
  description: "PPO commands velocity in a continuous kinematics environment"

accelerator:
  type: cpu

environment:
  name: gymnasium_vector
  id: PointMassKinematics-v0
  num_envs: 4
  vectorization_mode: sync
  kwargs:
    dynamics:
      name: velocity
      max_speed: 3.0
    dt: 0.1
    world_limit: 5.0
    start_position: [-4.0, -4.0]
    goal_position: [4.0, 4.0]
    goal_radius: 0.3
    max_steps: 100

evaluation_environment:
  name: gymnasium
  id: PointMassKinematics-v0
  kwargs:
    dynamics:
      name: velocity
      max_speed: 3.0
    dt: 0.1
    world_limit: 5.0
    start_position: [-4.0, -4.0]
    goal_position: [4.0, 4.0]
    goal_radius: 0.3
    max_steps: 100
    render_mode: rgb_array

models:
  policy:
    name: ppo_actor_critic
    hidden_sizes: [64, 64]
    initial_log_std: -0.5

optimizers:
  name: adam
  lr: 0.0003

trainer:
  ppo:
    total_timesteps: 128
    max_episode_steps: 100
    evaluation_frequency: 1
    evaluation_episodes: 1
    checkpoint_frequency: 0
    gamma: 0.99
    gae_lambda: 0.95
    rollout_steps: 8
    update_epochs: 2
    minibatch_size: 16
    clip_range: 0.2
    value_clip_range: 0.2
    value_loss_coefficient: 0.5
    entropy_coefficient: 0.01
    normalize_advantages: true

callbacks:
  local_metric_tracker:
    log_frequency: 1
